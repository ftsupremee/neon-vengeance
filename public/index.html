<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VENGEANCE — Retro Arcade Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-pink: #ff2d95;
    --neon-cyan: #00f0ff;
    --neon-yellow: #ffe34d;
    --neon-green: #39ff14;
    --bg: #05010d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #stage {
    position: relative;
    width: min(96vw, calc(96vh * 0.75));
    aspect-ratio: 3 / 4;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #05010d;
    image-rendering: pixelated;
    border: 3px solid var(--neon-pink);
    box-shadow: 0 0 18px rgba(255,45,149,.55), 0 0 60px rgba(0,240,255,.18), inset 0 0 40px rgba(0,0,0,.6);
  }
  /* CRT scanlines + vignette overlay */
  #crt {
    position: absolute;
    inset: 3px;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.22) 3px,
      rgba(0,0,0,.22) 4px
    );
    mix-blend-mode: multiply;
    z-index: 5;
  }
  #crt::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
  }
  /* Floating widgets over the canvas */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(3,0,10,.78);
    padding: 24px;
  }
  .hidden { display: none !important; }

  #title-screen h1 {
    font-size: clamp(18px, 4.5vw, 34px);
    color: var(--neon-pink);
    text-shadow: 0 0 8px var(--neon-pink), 4px 4px 0 #4b0f63;
    letter-spacing: 2px;
    margin-bottom: 10px;
    animation: flicker 3.2s infinite steps(1);
  }
  #title-screen .sub {
    font-size: clamp(8px, 1.8vw, 12px);
    color: var(--neon-cyan);
    text-shadow: 0 0 6px var(--neon-cyan);
    margin-bottom: 26px;
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: .5; }
    95% { opacity: 1; }
    97% { opacity: .7; }
  }
  .btn {
    font-family: inherit;
    font-size: clamp(9px, 2vw, 13px);
    color: #05010d;
    background: var(--neon-yellow);
    border: 0;
    padding: 14px 22px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255,227,77,.7), 4px 4px 0 #6b5b00;
    transition: transform .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--neon-cyan);
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0,240,255,.5);
  }
  .hint { font-size: 8px; color: #8f8fae; margin-top: 22px; line-height: 2; }
  .blink { animation: blink 1.1s infinite steps(2); }
  @keyframes blink { 50% { opacity: 0; } }

  /* Leaderboard */
  #scores-box {
    margin-top: 20px;
    min-width: min(78%, 340px);
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0,240,255,.4);
    padding: 12px 14px;
  }
  #scores-box h2 {
    font-size: 10px;
    color: var(--neon-yellow);
    text-shadow: 0 0 6px var(--neon-yellow);
    margin-bottom: 10px;
  }
  #scores-list { font-size: 9px; line-height: 2.1; text-align: left; color: var(--neon-green); }
  #scores-list .row { display: flex; justify-content: space-between; gap: 10px; }
  #scores-list .rank { color: var(--neon-pink); width: 2em; }
  #scores-list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scores-empty { font-size: 8px; color: #8f8fae; line-height: 2; }

  /* Game over / name entry */
  #gameover-screen h1 {
    font-size: clamp(16px, 4vw, 28px);
    color: var(--neon-red, #ff2d95);
    text-shadow: 0 0 10px var(--neon-pink);
    margin-bottom: 14px;
  }
  #final-score { font-size: clamp(14px, 3.5vw, 22px); color: var(--neon-yellow); margin-bottom: 18px; }
  #name-form { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #player-name {
    font-family: inherit;
    font-size: clamp(10px, 2.2vw, 14px);
    background: #12001f;
    color: var(--neon-green);
    border: 2px solid var(--neon-green);
    padding: 10px;
    width: min(70vw, 240px);
    text-align: center;
    text-transform: uppercase;
    outline: none;
    box-shadow: 0 0 10px rgba(57,255,20,.35);
  }
  #save-msg { font-size: 8px; margin-top: 12px; color: #8f8fae; min-height: 1.6em; }
  .name-label { font-size: 9px; color: var(--neon-cyan); }

  /* Sound toggle — always visible */
  #sound-toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 20;
    font-family: inherit;
    font-size: 9px;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--neon-cyan);
    background: rgba(5,1,13,.85);
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 8px rgba(0,240,255,.4);
  }
  #sound-toggle.off { color: #774d7c; border-color: #774d7c; box-shadow: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="crt"></div>
    <button id="sound-toggle" title="Toggle sound effects (M)">♪ SOUND: ON</button>

    <!-- Title screen -->
    <div id="title-screen" class="overlay">
      <h1>NEON<br>VENGEANCE</h1>
      <div class="sub">★ RETRO ARCADE SHOOTER ★</div>
      <button id="start-button" class="btn">▶ INSERT COIN</button>
      <div id="scores-box">
        <h2>— HIGH SCORES —</h2>
        <div id="scores-list"></div>
        <div id="scores-empty">NO SCORES YET.<br>BE THE FIRST HERO.</div>
      </div>
      <div class="hint">
        ← → / A D — MOVE &nbsp;&nbsp; SPACE — FIRE<br>
        P — PAUSE &nbsp;&nbsp; M — MUTE &nbsp;&nbsp; GRAB THE POWER-UPS!
      </div>
    </div>

    <!-- Game over screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <div id="final-score">SCORE: 0</div>
      <form id="name-form">
        <div class="name-label">ENTER YOUR CALLSIGN (3–10 CHARS)</div>
        <input id="player-name" maxlength="10" autocomplete="off" spellcheck="false" placeholder="AAA">
        <button id="save-score" class="btn" type="submit">SAVE SCORE</button>
      </form>
      <div id="save-msg"></div>
      <div class="hint"><span class="blink">▸ PRESS ENTER TO PLAY AGAIN</span></div>
    </div>
  </div>
</div>

<script src="game-core.js"></script>
<script src="game-input.js"></script>
<script src="game-spawn.js"></script>
<script src="game-combat.js"></script>
<script src="game-update.js"></script>
<script src="game-render.js"></script>
<script src="game-draw.js"></script>
<script src="game-ui.js"></script>
</body>
</html>
